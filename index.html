<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIU LIJIE | Portfolio</title>
  <style>
    /* 全局基础样式 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      /* ゴシック体（Sans-serif）のフォント指定 */
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "PingFang SC", sans-serif;
      background-color: #fafafa;
      color: #111;
      padding: 0 40px;
      -webkit-font-smoothing: antialiased;
    }

    /* 容器布局 */
    .container {
      max-width: 1000px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px 0;
    }

    /* 左上角姓名（ゴシック体） */
    header h1 {
      font-family: "Helvetica Neue", Arial, "Hiragino Sans", sans-serif;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* 主图展示区域 */
    main {
      margin: 60px 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .main-image-wrapper {
      width: 100%;
      max-width: 850px;
      cursor: pointer;
    }

    .main-image-wrapper img {
      width: 100%;
      height: auto;
      display: block;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      transition: opacity 0.3s ease;
    }

    .main-image-wrapper img:hover {
      opacity: 0.95;
    }

    /* 全屏图片弹窗 */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal img {
      max-width: 90%;
      max-height: 90vh;
      object-fit: contain;
    }

    /* 页脚 */
    footer {
      font-size: 11px;
      color: #aaa;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 左上角姓名 -->
    <header>
      <h1>LIU LIJIE</h1>
    </header>

    <!-- 主图区域 -->
    <main>
      <div class="main-image-wrapper" onclick="openModal('work1.jpg')">
        <img src="work1.jpg" alt="Artwork">
      </div>
    </main>

    <!-- 页脚 -->
    <footer>
      <p>© 2026 LIU LIJIE. All rights reserved.</p>
    </footer>
  </div>

  <!-- 点击放大查看结构 -->
  <div class="modal" id="modal" onclick="closeModal()">
    <img id="modal-img" src="" alt="Full view">
  </div>

  <script>
    function openModal(imageSrc) {
      const modal = document.getElementById('modal');
      const modalImg = document.getElementById('modal-img');
      modalImg.src = imageSrc;
      modal.style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }
  </script>

</body>
</html>
